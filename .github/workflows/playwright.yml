name: Run Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:       
  schedule:
    - cron: '0 7 * * *'    # Daily at 7:00 AM UTC (3:00 AM EDT)

jobs:
  test:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Start mock API and run API tests
        run: |
          npx kill-port 3000 || true
          npx json-server db.json --port 3000 &
          npx wait-on http://localhost:3000/users
          npx playwright test Tests/API


      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Deploy Playwright report to GitHub Pages
        if: always()  
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          publish_branch: gh-pages

      - name: Comment GitHub Pages Report link
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            Playwright Test Report  
            View the report at: https://wwamia.github.io/Wamia_QA_Portfolio/playwright-report/
